<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0b"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff2d55"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#cccccc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative gradient orbs -->
  <circle cx="200" cy="150" r="250" fill="url(#logoGrad)" opacity="0.08"/>
  <circle cx="1000" cy="500" r="350" fill="url(#logoGrad)" opacity="0.05"/>
  
  <!-- Grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  
  <!-- Large Hibiscus Flower -->
  <g transform="translate(180, 280)" filter="url(#glow)">
    <!-- Petals -->
    <ellipse cx="0" cy="-50" rx="25" ry="45" fill="url(#logoGrad)"/>
    <ellipse cx="45" cy="-15" rx="25" ry="45" fill="url(#logoGrad)" transform="rotate(72)"/>
    <ellipse cx="28" cy="40" rx="25" ry="45" fill="url(#logoGrad)" transform="rotate(144)"/>
    <ellipse cx="-28" cy="40" rx="25" ry="45" fill="url(#logoGrad)" transform="rotate(-144)"/>
    <ellipse cx="-45" cy="-15" rx="25" ry="45" fill="url(#logoGrad)" transform="rotate(-72)"/>
    
    <!-- Center -->
    <circle cx="0" cy="0" r="20" fill="#ffeb3b"/>
    <circle cx="0" cy="0" r="12" fill="#ff9800"/>
    
    <!-- Stamen -->
    <line x1="0" y1="0" x2="0" y2="-25" stroke="#fff" stroke-width="3"/>
    <circle cx="0" cy="-30" r="4" fill="#fff"/>
  </g>
  
  <!-- Main text: LUCAHMAN -->
  <text x="280" y="260" font-family="Arial Black, Helvetica, sans-serif" font-size="100" font-weight="900" fill="url(#textGrad)">LUCAHMAN</text>
  
  <!-- Tagline -->
  <text x="285" y="310" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#888888" letter-spacing="10">STREAMING</text>
  
  <!-- Malaysia badge -->
  <g transform="translate(280, 340)">
    <rect x="0" y="0" width="140" height="36" rx="6" fill="url(#logoGrad)" opacity="0.2"/>
    <text x="70" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="url(#logoGrad)" text-anchor="middle" letter-spacing="2">🇲🇾 MALAYSIA</text>
  </g>
  
  <!-- Bottom text -->
  <text x="600" y="520" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#ff6b35" text-anchor="middle" letter-spacing="3">PREMIUM ADULT ENTERTAINMENT</text>
  
  <!-- 18+ Badge -->
  <rect x="520" y="560" width="160" height="44" rx="8" fill="url(#logoGrad)"/>
  <text x="600" y="590" font-family="Arial Black, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">18+ ONLY</text>
  
  <!-- URL -->
  <text x="600" y="615" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#555555" text-anchor="middle">lucahman.store</text>
</svg>
