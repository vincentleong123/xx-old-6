<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="450" height="120">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff2d55"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8e8e8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Hibiscus Flower - Malaysia National Flower -->
  <g transform="translate(55, 60)" filter="url(#glow)">
    <!-- Petals -->
    <ellipse cx="0" cy="-25" rx="12" ry="20" fill="url(#logoGrad)"/>
    <ellipse cx="22" cy="-8" rx="12" ry="20" fill="url(#logoGrad)" transform="rotate(72)"/>
    <ellipse cx="14" cy="20" rx="12" ry="20" fill="url(#logoGrad)" transform="rotate(144)"/>
    <ellipse cx="-14" cy="20" rx="12" ry="20" fill="url(#logoGrad)" transform="rotate(-144)"/>
    <ellipse cx="-22" cy="-8" rx="12" ry="20" fill="url(#logoGrad)" transform="rotate(-72)"/>
    
    <!-- Center -->
    <circle cx="0" cy="0" r="10" fill="#ffeb3b"/>
    <circle cx="0" cy="0" r="6" fill="#ff9800"/>
    
    <!-- Stamen details -->
    <circle cx="0" cy="-4" r="1.5" fill="#fff"/>
    <circle cx="3" cy="-2" r="1.5" fill="#fff"/>
    <circle cx="3" cy="2" r="1.5" fill="#fff"/>
    <circle cx="0" cy="4" r="1.5" fill="#fff"/>
    <circle cx="-3" cy="2" r="1.5" fill="#fff"/>
    <circle cx="-3" cy="-2" r="1.5" fill="#fff"/>
    
    <!-- Long stamen -->
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#fff" stroke-width="1.5"/>
    <circle cx="0" cy="-14" r="2" fill="#fff"/>
  </g>
  
  <!-- Text: LUCAHMAN -->
  <text x="100" y="48" font-family="Arial Black, Helvetica, sans-serif" font-size="42" font-weight="900" fill="url(#textGrad)">LUCAHMAN</text>
  
  <!-- Tagline -->
  <text x="102" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#888888" letter-spacing="5">STREAMING</text>
  
  <!-- Malaysia indicator -->
  <rect x="380" y="35" width="50" height="20" rx="3" fill="#1a1a1e"/>
  <text x="405" y="50" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#888" text-anchor="middle" letter-spacing="1">🇲🇾 MY</text>
</svg>
