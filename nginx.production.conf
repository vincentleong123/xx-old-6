# LucahThaiX - Nginx Config for CF Argo Tunnel
# SSL handled by Cloudflare Tunnel (no cert needed on origin)

upstream lucaman_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP server (Cloudflare Tunnel handles SSL)
server {
    listen 8080;
    server_name xmelayu.site www.xmelayu.site;
    
    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/rss+xml application/atom+xml 
               image/svg+xml application/vnd.ms-fontobject application/x-font-ttf;

    # Static assets - long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Sitemap and robots
    location ~* \.(xml|txt)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # API routes - bypass cache
    location /api/ {
        proxy_pass http://localhost:7004;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    # 301 Redirect: /player/:id -> /:id (SEO)
    location ~* ^/player/(.+)$ {
        return 301 /$1;
    }
    
    # Video page routes (new format without /player/)
    location ~* ^/[A-Za-z0-9\-]+$ {
        proxy_pass http://localhost:7004;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main app
    location / {
        proxy_pass http://localhost:7004;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Logging
    access_log /var/log/nginx/lucaman_access.log;
    error_log /var/log/nginx/lucaman_error.log;
}
